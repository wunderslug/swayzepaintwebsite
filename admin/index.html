<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Project Manager | Swayze Painting</title>
  <link rel="stylesheet" href="/assets/css/site.css">
  <style>
    .manager{max-width:760px;margin:auto;padding:30px 18px 70px}.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:22px;margin:22px 0;box-shadow:0 8px 30px rgba(0,0,0,.05)}label{display:block;font-weight:700;margin:16px 0 7px}input,select,textarea{width:100%;box-sizing:border-box;padding:13px;border:1px solid #bbb;border-radius:9px;font:inherit;background:#fff}textarea{min-height:110px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{width:100%;padding:14px;border:0;border-radius:9px;font:inherit;font-weight:700;cursor:pointer;margin-top:14px}.secondary{background:#eee}.danger{background:#8b2020;color:#fff}.status{display:none;margin-top:15px;padding:12px;border-radius:9px}.ok{display:block;background:#e7f4e8}.error{display:block;background:#f9e6e6}.photos{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px}.photo{position:relative;background:#eee;border-radius:10px;overflow:hidden}.photo img{width:100%;height:150px;object-fit:cover;display:block}.photo select{border:0;border-radius:0}.photo button{position:absolute;right:6px;top:6px;border:0;border-radius:50%;width:32px;height:32px}.hint{opacity:.7;font-size:.92rem}.publish{display:flex;gap:10px;align-items:center;margin-top:18px}.publish input{width:auto}.publish label{margin:0}.project-card{display:grid;grid-template-columns:90px 1fr;gap:14px;padding:14px 0;border-top:1px solid #ddd;cursor:pointer}.project-card:first-child{border-top:0}.project-card img{width:90px;height:75px;object-fit:cover;border-radius:8px}.badge{font-size:.75rem;padding:3px 7px;border-radius:999px;background:#eee}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.editing{background:#f6f6f3;padding:8px 12px;border-radius:8px;display:none}@media(max-width:560px){.grid,.actions{grid-template-columns:1fr}.photos{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
<main class="manager">
  <p class="hint">Swayze Painting &amp; Fine Finish</p>
  <h1>Project Manager</h1>
  <div id="editing" class="editing"></div>

  <form id="projectForm" class="card">
    <label>Project title</label>
    <input id="title" required placeholder="Putnam Garage Door">

    <div class="grid">
      <div><label>Location</label><input id="location" placeholder="Putnam, CT"></div>
      <div><label>Service</label><select id="service"><option>Cabinet Refinishing</option><option>Interior Painting</option><option>Trim &amp; Doors</option><option>Deck Refinishing</option><option>Specialty Finish</option><option>Other</option></select></div>
    </div>

    <label>Description</label>
    <textarea id="description" placeholder="What was done on this project?"></textarea>

    <div class="card" style="box-shadow:none">
      <h2>Photos</h2>
      <p class="hint">One Before and one After photo per project. All additional photos are Details.</p>
      <div class="grid">
        <div><label>Photo type</label><select id="role"><option value="before">Before</option><option value="after">After</option><option value="detail">Detail</option></select></div>
        <div><label>Choose photo</label><input id="file" type="file" accept="image/jpeg,image/png,image/webp,image/avif"></div>
      </div>
      <button id="upload" class="btn secondary" type="button">Add photo</button>
      <div id="uploadStatus" class="status"></div>
      <div id="photos" class="photos"></div>
    </div>

    <div class="publish"><input id="published" type="checkbox"><label for="published">Publish to website</label></div>
    <button id="saveButton" class="btn" type="submit">Save new project</button>
    <div id="editActions" class="actions" style="display:none">
      <button id="cancel" class="btn secondary" type="button">Cancel editing</button>
      <button id="delete" class="btn danger" type="button">Delete project</button>
    </div>
    <div id="saveStatus" class="status"></div>
  </form>

  <section class="card">
    <h2>Saved projects</h2>
    <p class="hint">Tap a project to view or edit it.</p>
    <div id="projectList"><p class="hint">Loading…</p></div>
  </section>
</main>
<script src="/assets/js/admin.js"></script>
</body>
</html>
