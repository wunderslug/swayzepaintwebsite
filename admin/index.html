<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Portfolio Manager | Swayze Painting</title>
  <link rel="stylesheet" href="/assets/css/site.css">
  <style>
    .manager{max-width:720px;margin:0 auto;padding:32px 20px 64px}.manager h1{margin-bottom:8px}.manager-card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:22px;margin-top:24px;box-shadow:0 8px 30px rgba(0,0,0,.05)}.manager label{display:block;font-weight:700;margin:18px 0 7px}.manager input,.manager select{width:100%;box-sizing:border-box;padding:13px;border:1px solid #bbb;border-radius:9px;font:inherit;background:#fff}.manager button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:9px;font:inherit;font-weight:700;cursor:pointer}.manager button:disabled{opacity:.55;cursor:wait}.status{margin-top:18px;padding:13px;border-radius:9px;background:#f2f2f2;display:none}.status.ok{display:block;background:#e7f4e8}.status.error{display:block;background:#f9e6e6}.preview{display:none;margin-top:16px}.preview img{max-width:100%;max-height:360px;border-radius:10px;object-fit:contain;background:#eee}.hint{opacity:.72;font-size:.92rem}.key{font-family:monospace;word-break:break-all}
  </style>
</head>
<body>
  <main class="manager">
    <p class="hint">Swayze Painting &amp; Fine Finish</p>
    <h1>Portfolio Manager</h1>
    <p>Upload a project photo directly to the portfolio media bucket.</p>

    <form id="uploadForm" class="manager-card">
      <label for="project">Project name</label>
      <input id="project" name="project" required placeholder="Pomfret kitchen cabinets">

      <label for="role">Photo type</label>
      <select id="role" name="role" required>
        <option value="before">Before</option>
        <option value="after">After</option>
        <option value="detail">Detail</option>
      </select>

      <label for="file">Photo</label>
      <input id="file" name="file" type="file" accept="image/jpeg,image/png,image/webp,image/avif" required>
      <p class="hint">JPEG, PNG, WebP or AVIF. Maximum 15 MB.</p>

      <div id="preview" class="preview"><img id="previewImage" alt="Selected photo preview"></div>
      <button id="submitButton" type="submit">Upload photo</button>
      <div id="status" class="status" role="status"></div>
    </form>
  </main>

<script>
const form=document.getElementById('uploadForm');
const fileInput=document.getElementById('file');
const preview=document.getElementById('preview');
const previewImage=document.getElementById('previewImage');
const statusBox=document.getElementById('status');
const button=document.getElementById('submitButton');
let previewUrl;

fileInput.addEventListener('change',()=>{
  if(previewUrl) URL.revokeObjectURL(previewUrl);
  const file=fileInput.files[0];
  if(!file){preview.style.display='none';return;}
  previewUrl=URL.createObjectURL(file);
  previewImage.src=previewUrl;
  preview.style.display='block';
});

form.addEventListener('submit',async(event)=>{
  event.preventDefault();
  statusBox.className='status';
  statusBox.style.display='block';
  statusBox.textContent='Uploading…';
  button.disabled=true;
  try{
    const response=await fetch('/api/media/upload',{method:'POST',body:new FormData(form)});
    const result=await response.json();
    if(!response.ok||!result.ok) throw new Error(result.error||'Upload failed.');
    statusBox.className='status ok';
    statusBox.innerHTML='Upload complete.<br><span class="key">'+escapeHtml(result.key)+'</span>';
    fileInput.value='';
    preview.style.display='none';
  }catch(error){
    statusBox.className='status error';
    statusBox.textContent=error.message||'Upload failed.';
  }finally{button.disabled=false;}
});

function escapeHtml(value){const d=document.createElement('div');d.textContent=value;return d.innerHTML;}
</script>
</body>
</html>
